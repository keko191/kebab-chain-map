name: Refresh sunbed and tanning locations

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/discover-sunbeds.yml"
      - "sunbeds/discover_sunbeds.py"
      - "requirements.txt"
  workflow_dispatch:
  schedule:
    - cron: "17 5 3 * *"

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Discover sunbed and tanning locations
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OUTPUT_FILE: sunbeds/stores_sunbeds.json
        run: python sunbeds/discover_sunbeds.py

      - name: Commit updated location list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sunbeds/stores_sunbeds.json
          git diff --cached --quiet || git commit -m "Refresh sunbed locations [automated]"
          git pull --rebase
          git push
