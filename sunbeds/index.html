<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sunbed & Tanning Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
  html, body { height:100%; margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  #map { height:100%; width:100%; }
  .panel {
    position:absolute; top:12px; right:12px; z-index:1000;
    background:white; padding:14px 16px; border-radius:10px;
    box-shadow:0 2px 12px rgba(0,0,0,.2); font-size:14px; width:270px;
  }
  .panel h3 { margin:0 0 8px; font-size:16px; }
  .panel label { display:flex; align-items:center; gap:8px; margin:7px 0; cursor:pointer; }
  .panel .row { display:flex; align-items:center; justify-content:space-between; margin:10px 0 5px; }
  .panel input[type=range] { width:100%; }
  .swatch { width:12px; height:12px; border-radius:50%; display:inline-block; border:1px solid rgba(0,0,0,.2); }
  .strong { background:#8b5cf6; }
  .possible { background:#f59e0b; }
  .chain { background:#111827; }
  .note { font-size:12px; color:#555; line-height:1.35; margin:10px 0 0; }
  #status {
    position:absolute; bottom:12px; left:12px; z-index:1000;
    background:white; padding:7px 10px; border-radius:6px; font-size:12px;
    box-shadow:0 1px 6px rgba(0,0,0,.15);
  }
  .popup-meta { color:#666; font-size:12px; margin-top:4px; line-height:1.35; }
  .popup-link { display:inline-block; margin-top:5px; }
</style>
</head>
<body>

<div id="map"></div>
<div class="panel">
  <h3>Sunbed & Tanning Map</h3>
  <label><input type="checkbox" id="toggleStrong" checked><span class="swatch strong"></span> Sunbed match</label>
  <label><input type="checkbox" id="togglePossible" checked><span class="swatch possible"></span> Tanning-only match</label>
  <label><input type="checkbox" id="toggleChains" checked><span class="swatch chain"></span> Known chains</label>
  <div class="row"><span>Competition radius</span><span id="radiusVal">3.0 km</span></div>
  <input type="range" id="radiusSlider" min="0" max="10000" step="250" value="3000">
  <p class="note">Purple = surfaced from a sunbed/sunbeds search. Amber = only surfaced from tanning salon. Black centre = known chain. Use the circles to spot gaps, but verify tanning-only results because some may be spray-tan/beauty businesses.</p>
</div>
<div id="status">Loading salon data…</div>

<script>
const map = L.map('map').setView([51.43, -0.35], 10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom:19,
  attribution:'&copy; OpenStreetMap contributors'
}).addTo(map);

const strongLayer = L.layerGroup().addTo(map);
const possibleLayer = L.layerGroup().addTo(map);
const chainLayer = L.layerGroup().addTo(map);
let currentRadius = 3000;

const KNOWN_CHAINS = [
  "indigo sun",
  "consol",
  "the tanning shop",
  "tanning shop",
  "the sunshine co",
  "sunshine co",
  "tango'd",
  "tangod",
  "kwik tan",
  "lextan"
];

function norm(s) {
  return (s || "").toLowerCase().replace(/[’']/g, "").replace(/\s+/g, " ").trim();
}
function isKnownChain(store) {
  const n = norm(store.name);
  return KNOWN_CHAINS.some(x => n.includes(norm(x)));
}
function isStrongSunbedMatch(store) {
  return (store.matched_queries || []).some(q => q === "sunbed" || q === "sunbeds");
}
function mapsUrl(store) {
  if (store.google_maps_uri) return store.google_maps_uri;
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent((store.name || "") + " " + (store.address || ""));
}
function popupHtml(store) {
  const queries = (store.matched_queries || []).join(", ");
  const rating = store.rating ? `${store.rating}★${store.user_rating_count ? " (" + store.user_rating_count + ")" : ""}` : "No rating captured";
  const chain = isKnownChain(store) ? "<br><b>Known chain</b>" : "";
  return `<b>${store.name || "Unnamed salon"}</b><br>${store.address || ""}${chain}
    <div class="popup-meta">Matched: ${queries || "—"}<br>${rating}</div>
    <a class="popup-link" href="${mapsUrl(store)}" target="_blank" rel="noopener">Open in Google Maps</a>`;
}

function render() {
  strongLayer.clearLayers();
  possibleLayer.clearLayers();
  chainLayer.clearLayers();

  const stores = window._sunbedStores || [];
  stores.forEach(store => {
    if (store.lat == null || store.lng == null) return;

    const strong = isStrongSunbedMatch(store);
    const color = strong ? "#8b5cf6" : "#f59e0b";
    const layer = strong ? strongLayer : possibleLayer;

    if (currentRadius > 0) {
      L.circle([store.lat, store.lng], {
        radius: currentRadius,
        color,
        fillColor: color,
        fillOpacity: strong ? 0.045 : 0.03,
        weight:0,
        interactive:false
      }).addTo(layer);
    }

    L.circleMarker([store.lat, store.lng], {
      radius:6,
      color:"#ffffff",
      fillColor:color,
      fillOpacity:1,
      weight:1.5
    }).bindPopup(popupHtml(store)).addTo(layer);

    if (isKnownChain(store)) {
      L.circleMarker([store.lat, store.lng], {
        radius:2.6,
        color:"#111827",
        fillColor:"#111827",
        fillOpacity:1,
        weight:1
      }).bindPopup(popupHtml(store)).addTo(chainLayer);
    }
  });
}

function updateRadius(v) {
  currentRadius = v;
  document.getElementById("radiusVal").textContent = (v / 1000).toFixed(v % 1000 === 0 ? 0 : 1) + " km";
  render();
}

document.getElementById("radiusSlider").addEventListener("input", e => updateRadius(parseInt(e.target.value)));
document.getElementById("toggleStrong").addEventListener("change", e => e.target.checked ? map.addLayer(strongLayer) : map.removeLayer(strongLayer));
document.getElementById("togglePossible").addEventListener("change", e => e.target.checked ? map.addLayer(possibleLayer) : map.removeLayer(possibleLayer));
document.getElementById("toggleChains").addEventListener("change", e => e.target.checked ? map.addLayer(chainLayer) : map.removeLayer(chainLayer));

async function loadData() {
  const status = document.getElementById("status");
  try {
    const resp = await fetch("stores_sunbeds.json?v=" + Date.now());
    if (!resp.ok) throw new Error("Could not fetch salon data");
    const payload = await resp.json();
    window._sunbedStores = Array.isArray(payload) ? payload : (payload.stores || []);
    render();

    const valid = window._sunbedStores.filter(s => s.lat != null && s.lng != null);
    if (valid.length) {
      map.fitBounds(L.latLngBounds(valid.map(s => [s.lat, s.lng])), {padding:[30,30]});
    }
    const strong = valid.filter(isStrongSunbedMatch).length;
    const possible = valid.length - strong;
    const updated = payload.generated_at ? " · updated " + new Date(payload.generated_at).toLocaleDateString() : "";
    status.textContent = `${valid.length} locations · ${strong} sunbed matches · ${possible} tanning-only${updated}`;
  } catch (err) {
    status.textContent = "Salon data not loaded yet";
    console.error(err);
  }
}
loadData();
</script>
</body>
</html>
